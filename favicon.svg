<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0B1C2D"/>

  <!-- AS Monogram -->
  <text
    x="32"
    y="32"
    text-anchor="middle"
    font-size="22"
    fill="#F7F9FC"
    font-family="Inter, Helvetica, Arial, sans-serif"
    font-weight="600"
    letter-spacing="0.5"
  >
    AS
  </text>

  <!-- Arc (mental model) -->
  <path
    d="M18 40 A18 18 0 0 1 46 40"
    fill="none"
    stroke="#F7F9FC"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Dot (insight) -->
  <circle cx="32" cy="40" r="2.5" fill="#F7F9FC"/>
</svg>
